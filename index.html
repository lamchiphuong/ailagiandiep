<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ai là gián điệp?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5fb; --card:#fff; --ink:#1e1b4b; --muted:#6b7280; --line:#e6e8f2;
    --primary:#6366f1; --primary2:#8b5cf6; --pink:#ec4899; --green:#10b981; --red:#ef4444; --amber:#f59e0b;
    --shadow:0 10px 30px -12px rgba(79,70,229,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(700px 360px at 0% -10%,#e0e7ff 0,transparent 60%),radial-gradient(600px 360px at 100% 0,#fce7f3 0,transparent 55%),var(--bg);
    color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:20px;margin:6px 0 16px}
  .brand i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--pink));font-size:20px;box-shadow:var(--shadow)}
  .card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(99,102,241,.08);margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:17px;font-weight:700}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(99,102,241,.08)}
  .stat .n{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .t{font-size:12px;color:var(--muted);font-weight:600}
  button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;color:var(--ink);background:#eef0ff;transition:transform .1s}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5}
  .primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 20px -8px rgba(99,102,241,.7)}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .full{width:100%}
  input[type=text],input[type=tel]{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fafbff;color:var(--ink);font:inherit;outline:none;text-align:center;font-size:20px;letter-spacing:6px}
  .muted{color:var(--muted);font-size:14px}
  .center{text-align:center}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .vbtn{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 8px;text-align:center;font-weight:700;font-size:17px;display:block;width:100%}
  .vbtn .av{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
  .vbtn:active{border-color:var(--primary);background:#f5f6ff}
  .vbtn.sel{border-color:var(--primary);background:#eef0ff}
  .pchips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
  .pchip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
  .pchip.dead{opacity:.45;text-decoration:line-through}
  .okbox{text-align:center;padding:10px}
  .okbox .e{font-size:50px}
  .bar-row{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;margin-bottom:5px;font-weight:700}
  .bar{height:16px;background:#eef0fb;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#818cf8,#6366f1);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .bar-row.topv .bar>i{background:linear-gradient(90deg,#fb7185,#ef4444)}
  .verdict{text-align:center;padding:8px 0 4px}
  .verdict .name{font-size:34px;font-weight:800;color:var(--red);margin:4px 0}
  .verdict .word{display:inline-block;margin-top:8px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:14px;padding:7px 16px;font-weight:700}
  .win{text-align:center;padding:22px 14px;border-radius:22px;color:#fff;font-size:24px;font-weight:800;margin-bottom:14px;background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 14px 30px -12px rgba(16,185,129,.7)}
  .win.spy{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 14px 30px -12px rgba(244,63,94,.7)}
  .word{text-align:center;background:linear-gradient(135deg,#eef0ff,#fdf2f8);border-radius:18px;padding:22px 10px;margin-bottom:10px}
  .word .w{font-size:34px;font-weight:800;color:var(--primary)}
  .word .h{font-size:34px;letter-spacing:8px;color:#c7cbe6}
  .deadb{background:#fff1f2;color:#be123c;border-radius:14px;padding:10px;text-align:center;font-weight:600;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-size:12px}
  .err{color:var(--red);font-size:14px;margin-top:8px}
  .link{background:none;border:0;color:var(--primary);padding:8px;font-weight:600;text-decoration:underline;cursor:pointer}
  .sheet{position:fixed;inset:0;background:rgba(30,27,75,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .sheet .box{background:#fff;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:24px 20px 28px;text-align:center}
  .sheet .box .nm{font-size:26px;font-weight:800;margin:6px 0 4px}
  select{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:#fafbff;font:inherit;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i>🕵️</i><span>Ai là gián điệp?</span></div>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* Link/QR do MC tạo sẽ kèm sẵn ?room=...&db=... nên khán giả không cần nhập gì. */
const DEFAULT_DB_URL = 'https://quaysomayman-be666-default-rtdb.asia-southeast1.firebasedatabase.app';
const COLORS = ['#6366f1','#ec4899','#10b981','#f59e0b','#06b6d4'];

const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
let db, ref, R=null, room='', mode='main', showWord=false, lastRound=null;
function wordsList(){
  const h = R.wordsHist||{};
  return Object.keys(h).sort((a,b)=>a.slice(1)-b.slice(1)).map(k=>`Vòng ${k.slice(1)}: Dân <b>${esc(h[k].civ)}</b> · Gián điệp <b>${esc(h[k].spy)}</b>`).join('<br>');
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idNum = id => parseInt(String(id).slice(1))||0;
const sorted = pl => Object.entries(pl||{}).map(([id,p])=>({id,...p})).sort((a,b)=>idNum(a.id)-idNum(b.id));
const color = id => COLORS[(idNum(id)-1)%COLORS.length];
const ini = n => esc(String(n).trim().charAt(0).toUpperCase());
const dev = (()=>{ let d=localStorage.getItem('gd-dev'); if(!d){ d='d'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('gd-dev',d);} return d; })();

/* ---------- BOOT ---------- */
function boot(){
  if(typeof firebase==='undefined'){ app.innerHTML=`<div class="card"><h2>Không tải được dữ liệu</h2><div class="err">Kiểm tra mạng rồi tải lại trang.</div></div>`; return; }
  let url = qs.get('db') || DEFAULT_DB_URL || localStorage.getItem('gd-db-url') || '';
  if(!url){ app.innerHTML=`<div class="card center"><h2>Hãy quét lại mã QR của MC</h2><div class="muted">Link chưa có thông tin kết nối.</div></div>`; return; }
  localStorage.setItem('gd-db-url',url);
  try{ firebase.initializeApp({databaseURL:url}); db=firebase.database(); }
  catch(e){ app.innerHTML=`<div class="card"><div class="err">Link không hợp lệ.</div></div>`; return; }
  room = (qs.get('room') || localStorage.getItem('gd-room') || '').toLowerCase();
  if(!room) return viewRoom();
  join(room);
}
function viewRoom(msg){
  app.innerHTML = `<div class="card"><h2>Nhập mã phòng</h2><input type="text" id="rc" style="letter-spacing:2px" placeholder="vd: 20-11" value="${esc(room)}">
    ${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="primary full" style="margin-top:12px" onclick="doRoom()">Vào</button>
    ${room?`<button class="ghost full" style="margin-top:8px" onclick="join('${esc(room)}')">← Quay lại phòng ${esc(room)}</button>`:''}</div>`;
}
function changeRoom(){
  if(ref) ref.off();
  mode='main'; showWord=false; lastRound=null; R=null;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  viewRoom();
}
function doRoom(){ const v=document.getElementById('rc').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,''); if(!v) return viewRoom('Nhập mã phòng'); join(v); }
function join(code){
  room=code; localStorage.setItem('gd-room',room);
  if(ref) ref.off();
  ref = db.ref('gian-diep/'+room);
  ref.on('value', s=>{ R=s.val(); render(); },
    e=>{ app.innerHTML=`<div class="card"><div class="err">Lỗi kết nối: ${esc(e.message)}</div></div>`; });
}

/* ---------- PLAYER LOGIN (người chơi trên sân khấu) ---------- */
function myPlayer(){
  if(!R||!R.players) return null;
  try{
    const me = JSON.parse(localStorage.getItem('gd-me-'+room));
    if(me && R.players[me.id] && String(R.players[me.id].pin)===String(me.pin)) return {id:me.id,...R.players[me.id]};
  }catch(e){}
  return null;
}
function viewPlayerLogin(){
  const list = sorted(R.players);
  app.innerHTML = `<div class="card"><h2>🎭 Dành cho người chơi trên sân khấu</h2>
    <div class="muted" style="margin-bottom:12px">Chọn tên của bạn và nhập mã PIN do MC đưa để xem từ khoá bí mật.</div>
    <select id="who">${list.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <input type="tel" id="pin" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="err" id="perr"></div>
    <button class="primary full" style="margin-top:12px" onclick="doPlayer()">Xem từ khoá</button>
    <button class="ghost full" style="margin-top:8px" onclick="mode='main';render()">← Quay lại</button></div>`;
}
function doPlayer(){
  const id = document.getElementById('who').value, pin = document.getElementById('pin').value.trim();
  if(R.players[id] && String(R.players[id].pin)===pin){
    localStorage.setItem('gd-me-'+room, JSON.stringify({id,pin})); mode='main'; showWord=false; render();
  } else document.getElementById('perr').textContent='Sai mã PIN, thử lại nhé.';
}

/* ---------- RENDER ---------- */
function render(){
  if(mode==='plogin' && R && R.players) return viewPlayerLogin();
  if(!R || !R.phase){
    app.innerHTML = `<div class="card center"><div style="font-size:48px">⏳</div><h2>Chương trình sắp bắt đầu</h2><div class="muted">Giữ nguyên trang này, game sẽ tự cập nhật.</div>
      <div class="muted" style="margin-top:12px">Phòng <b>${esc(room)}</b> · <button class="link" onclick="changeRoom()">Đổi phòng</button></div></div>`; return;
  }
  const list = sorted(R.players), alive = list.filter(p=>p.alive);
  const me = myPlayer();
  if(R.round!==lastRound){ lastRound=R.round; showWord=false; }
  let h = `<div class="stats"><div class="stat"><div class="n">${R.round}</div><div class="t">VÒNG ĐANG CHƠI</div></div>
    <div class="stat"><div class="n">${alive.length}/${list.length}</div><div class="t">NGƯỜI CÒN LẠI</div></div></div>`;

  if(R.winner) h += winnerBanner();
  if(me) h += keywordCard(me);

  if(R.phase==='describe') h += `<div class="card center"><div style="font-size:44px">👀</div><h2>Hãy quan sát!</h2>
      <div class="muted">Người chơi đang lần lượt mô tả từ khoá. Khi MC mở bình chọn, bạn sẽ chọn người nghi là gián điệp.</div></div>`;
  else if(R.phase==='vote') h += voteCard(list, alive);
  else if(R.phase==='result') h += resultCard();

  h += `<div class="card"><h2>Người chơi</h2><div class="pchips">${list.map(p=>`<span class="pchip ${p.alive?'':'dead'}"><span class="av" style="background:${color(p.id)}">${ini(p.name)}</span>${esc(p.name)}</span>`).join('')}</div></div>`;
  if(!me) h += `<div class="center"><button class="link" onclick="mode='plogin';render()">🎭 Tôi là người chơi trên sân khấu</button></div>`;
  h += `<div class="center muted" style="margin-top:6px">Phòng <b>${esc(room)}</b> · <button class="link" onclick="changeRoom()">Đổi phòng</button></div>`;
  app.innerHTML = h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar>i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%')));
}

function winnerBanner(){
  if(R.phase!=='result') return '';
  if(R.winner==='stopped') return `<div class="win" style="background:linear-gradient(135deg,#64748b,#334155)">⏹ MC đã kết thúc trò chơi</div>`;
  const w = R.winner==='civ';
  return `<div class="win ${w?'':'spy'}">${w?'🎉 Khán giả & người chơi chiến thắng!':'🕵️ Gián điệp chiến thắng!'}</div>`;
}
function keywordCard(me){
  const word = R.words ? R.words[me.role] : '';
  return `<div class="card">${me.alive?'':'<div class="deadb">💀 Bạn đã bị loại</div>'}<h2>🔒 Từ khoá vòng ${R.round} của ${esc(me.name)}</h2>
    <div class="word">${showWord?`<div class="w">${esc(word)}</div>`:`<div class="h">••••••</div>`}</div>
    <button class="ghost full" onclick="showWord=!showWord;render()">${showWord?'🙈 Ẩn từ khoá':'👁 Hiện từ khoá'}</button></div>`;
}

function voteCard(list, alive){
  const votes = R.votes||{}, mine = votes[dev];
  const cands = (R.candidates&&R.candidates.length ? R.candidates.filter(id=>R.players[id]&&R.players[id].alive) : alive.map(p=>p.id));
  if(mine){
    const p = R.players[mine];
    return `<div class="card okbox"><div class="e">✅</div><h2>Bạn đã bình chọn!</h2>
      <div class="muted">Bạn nghi ngờ</div><div style="font-size:26px;font-weight:800;margin:4px 0">${esc(p?p.name:'')}</div>
      <div class="muted">Chờ MC công bố kết quả…</div></div>`;
  }
  const revote = R.candidates && R.candidates.length;
  return `<div class="card"><h2>🗳 ${revote?'Bình chọn lại! ':''}Bạn nghi ai là gián điệp?</h2>
    ${revote?`<div class="muted" style="margin-bottom:10px">Chỉ chọn giữa những người hòa phiếu.</div>`:''}
    <div class="pgrid">${cands.map(id=>{const p=R.players[id];return `<button class="vbtn" onclick="askVote('${id}')"><div class="av" style="background:${color(id)}">${ini(p.name)}</div>${esc(p.name)}</button>`;}).join('')}</div>
    <div class="muted center" style="margin-top:12px">Mỗi người chỉ được bình chọn 1 lần trong mỗi vòng</div></div>`;
}
function askVote(id){
  const p = R.players[id];
  const s = document.createElement('div'); s.className='sheet'; s.id='sheet';
  s.innerHTML = `<div class="box"><div class="muted">Bạn chắc chắn bình chọn cho</div><div class="nm">${esc(p.name)}</div>
    <div class="muted" style="margin-bottom:16px">là gián điệp? Không thể đổi lại.</div>
    <button class="primary full" onclick="castVote('${id}')">✓ Xác nhận</button>
    <button class="ghost full" style="margin-top:8px" onclick="closeSheet()">Chọn lại</button></div>`;
  document.body.appendChild(s);
}
function closeSheet(){ const s=document.getElementById('sheet'); if(s) s.remove(); }
function castVote(id){
  closeSheet();
  if(!R || R.phase!=='vote') return;
  ref.child('votes/'+dev).transaction(cur=>cur?undefined:id,(err,ok)=>{
    if(!ok && !err) { /* đã bình chọn rồi */ }
  });
}

function resultCard(){
  if(R.winner==='stopped'){
    return `<div class="card"><h2>Tiết lộ vai trò</h2><table><tr><th>Người chơi</th><th>Vai trò</th><th>Từ khoá</th></tr>${
      sorted(R.players).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.role==='spy'?'🕵️ Gián điệp':'Dân'}</td><td>${esc(R.words[p.role])}</td></tr>`).join('')}</table><div class="muted" style="margin-top:10px;line-height:1.8">${wordsList()}</div></div>`;
  }
  const r = R.result||{counts:[],top:[]}, counts=r.counts||[], top=r.top||[];
  const nm = id=>esc((R.players[id]||{}).name);
  let h = `<div class="card"><h2>📊 Kết quả vòng ${r.round||R.round}</h2>${counts.map(c=>{
    const pct = r.total? c.n/r.total*100 : 0;
    return `<div class="bar-row ${top.includes(c.id)&&c.n>0?'topv':''}"><div class="bar-top"><span>${nm(c.id)}</span><span>${c.n} phiếu</span></div>
      <div class="bar"><i data-w="${pct}"></i></div></div>`;}).join('')}`;
  if(r.noVotes) h += `<div class="verdict muted">Chưa có ai bình chọn</div>`;
  else if(r.elim){
    const p = R.players[r.elim];
    h += `<div class="verdict"><div class="muted">Người bị loại</div><div class="name">${esc(p.name)}</div><div class="word">Từ khoá: ${esc(R.words[p.role])}</div></div>`;
  } else h += `<div class="verdict"><div class="muted">⚖️ Hòa phiếu giữa</div><div class="name" style="font-size:22px;color:var(--amber)">${top.map(nm).join(' · ')}</div><div class="muted">Sẽ bình chọn lại</div></div>`;
  h += `</div>`;
  if(R.winner){
    h += `<div class="card"><h2>Tiết lộ vai trò</h2><table><tr><th>Người chơi</th><th>Vai trò</th><th>Từ khoá</th></tr>${
      sorted(R.players).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.role==='spy'?'🕵️ Gián điệp':'Dân'}</td><td>${esc(R.words[p.role])}</td></tr>`).join('')}</table><div class="muted" style="margin-top:10px;line-height:1.8">${wordsList()}</div></div>`;
  } else h += `<div class="muted center" style="margin-bottom:14px">Chờ MC chuyển sang bước tiếp theo…</div>`;
  return h;
}

boot();
</script>
</body>
</html>
